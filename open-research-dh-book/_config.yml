# Website settings (Jupyter Book version 1)
title: Open Research in the Digital Humanities
author: HDSM and DisLab, TU Darmstadt, with the HERMES project
copyright: "2026"
logo: _static/logo.svg
only_build_toc_files: true
exclude_patterns: [_build, "**.ipynb_checkpoints", "**/publication/**", "**/data/**", "**/outputs/**",
                   "README.md", "LICENSE-CONTENT.md"]

execute:
  execute_notebooks: "off"   # the pages are shown as they are saved; learners run the code themselves

repository:
  url: https://github.com/HDSM-TUDarmstadt/open_research_DH
  branch: main

launch_buttons:
  colab_url: "https://colab.research.google.com"   # the rocket button opens each page in Google Colab
  notebook_interface: classic

html:
  favicon: _static/favicon.svg
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  use_download_button: true
  home_page_in_navbar: false
  extra_footer: |
    <p>Open Research in the Digital Humanities · HDSM and DisLab, TU Darmstadt · HERMES project ·
    texts CC BY 4.0, code MIT</p>

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - tasklist
    - html_image

sphinx:
  recursive_update: true            # add to the theme settings above instead of replacing them
  config:
    html_show_copyright: false
    html_theme_options:
      show_toc_level: 2
      navigation_with_keys: false
      logo:
        text: Open Research in the Digital Humanities
